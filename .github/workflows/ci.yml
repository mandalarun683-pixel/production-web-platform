
name: Production Web Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t production-web-platform:test .

      - name: Run application container
        run: docker run -d --name production-test -p 8080:80 production-web-platform:test

      - name: Test application response
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/; then
              echo "Application test passed!"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done

          echo "Application test failed!"
          docker logs production-test
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm -f production-test || true

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/production-web-platform:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/production-web-platform:${{ github.sha }}

